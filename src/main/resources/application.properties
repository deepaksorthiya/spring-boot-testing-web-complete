spring.application.name=spring-boot-testing-web-complete
app.greet.message=default greet message
app.home.message=default hello message
app.post.api.base-url=https://jsonplaceholder.typicode.com

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/posts}
spring.datasource.username=${DB_USERNAME:posts}
spring.datasource.password=${DB_PASSWORD:posts}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
