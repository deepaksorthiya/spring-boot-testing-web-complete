services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: posts
      POSTGRES_USER: ${DB_USERNAME:-posts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-posts}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - post-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  post-data:
